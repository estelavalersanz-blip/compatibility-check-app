<!--
  Plantilla real, configurada en el Dashboard de Supabase (Authentication → Notifications → Emails
  → "Password changed", NO en la pestaña clásica "Email Templates" — es una notificación nativa
  distinta, ver el resto del apartado de SMTP en el README) — asunto: "Tu contraseña ha cambiado".
  Copia de referencia versionada en el repo (ver nota en recovery.html sobre mantenerla sincronizada
  a mano con el Dashboard). A diferencia de las otras dos plantillas de esta carpeta, el botón no
  lleva un enlace con token: esta notificación se dispara DESPUÉS de un cambio de contraseña ya
  hecho, así que enlaza a la URL fija de "olvidé mi contraseña" para quien quiera revertirlo.
-->
<div style="background-color:#FDF0D5;padding:32px 16px;font-family:'Poppins','DM Sans',Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background-color:#ffffff;border-radius:12px;overflow:hidden;">
    <tr>
      <td style="background-color:#BE1E2D;background-image:linear-gradient(160deg,#FB8500 0%,#BE1E2D 100%);padding:32px 24px;text-align:center;">
        <span style="display:inline-block;font-family:'Poppins','DM Sans',Arial,sans-serif;font-size:22px;font-weight:700;color:#ffffff;letter-spacing:0.5px;">AfinIA</span>
      </td>
    </tr>
    <tr>
      <td style="padding:32px 28px;">
        <h1 style="margin:0 0 12px;font-family:'Poppins','DM Sans',Arial,sans-serif;font-size:20px;font-weight:700;color:#000000;">Tu contraseña ha cambiado</h1>
        <p style="margin:0 0 24px;font-family:'Poppins','DM Sans',Arial,sans-serif;font-size:14px;line-height:1.6;color:#000000;">
          La contraseña de tu cuenta en AfinIA se ha actualizado correctamente.
        </p>
        <p style="margin:0 0 24px;font-family:'Poppins','DM Sans',Arial,sans-serif;font-size:14px;line-height:1.6;color:#000000;">
          Si has sido tú, no hace falta que hagas nada más.
        </p>
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 24px;">
          <tr>
            <td style="border-radius:8px;background-color:#000000;">
              <a href="https://compatibility-check-app.vercel.app/auth/forgot-password" style="display:inline-block;padding:12px 28px;font-family:'Poppins','DM Sans',Arial,sans-serif;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:8px;">
                Si no has sido tú, restablécela aquí
              </a>
            </td>
          </tr>
        </table>
        <p style="margin:0;font-family:'Poppins','DM Sans',Arial,sans-serif;font-size:12px;line-height:1.5;color:#6c6c6c;">
          Si no reconoces este cambio, te recomendamos restablecer tu contraseña de inmediato.
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:16px 28px;text-align:center;background-color:#FDF0D5;">
        <p style="margin:0;font-family:'Poppins','DM Sans',Arial,sans-serif;font-size:11px;color:#6c6c6c;">AfinIA</p>
      </td>
    </tr>
  </table>
</div>
