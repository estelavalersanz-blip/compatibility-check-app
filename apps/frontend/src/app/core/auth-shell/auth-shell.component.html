<div class="auth-shell d-flex flex-column align-items-center justify-content-center text-center px-3 py-5">
  <app-brand-mark [white]="true" class="mb-2" />
  @if (wordmark()) {
    <h1 class="h3 text-white mb-4">{{ title() }}</h1>
  } @else if (title()) {
    <h1 class="h4 text-white mb-4">{{ title() }}</h1>
  }
  <ng-content />
</div>
