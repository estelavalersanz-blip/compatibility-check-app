<app-auth-shell title="Registro">
  <form class="w-100 text-start" style="max-width: 360px;" [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label class="form-label" for="email">Email</label>
      <input
        id="email"
        type="email"
        class="form-control"
        formControlName="email"
        [class.is-invalid]="form.controls.email.invalid && form.controls.email.touched"
      />
      <div class="invalid-feedback">Introduce un email válido.</div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        class="form-control"
        formControlName="password"
        [class.is-invalid]="form.controls.password.invalid && form.controls.password.touched"
      />
      <div class="form-text">{{ passwordRequirementsMessage }}</div>
      <div class="invalid-feedback">{{ passwordRequirementsMessage }}</div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="passwordConfirm">Repite la contraseña</label>
      <input
        id="passwordConfirm"
        type="password"
        class="form-control"
        formControlName="passwordConfirm"
        [class.is-invalid]="form.controls.passwordConfirm.touched && (form.controls.passwordConfirm.invalid || form.errors?.['passwordMismatch'])"
      />
      <div class="invalid-feedback">Las contraseñas no coinciden.</div>
    </div>
    @if (submitError()) {
      <div class="alert alert-danger py-2" role="alert">{{ submitError() }}</div>
    }
    <button type="submit" class="btn btn-dark w-100 mb-3" [disabled]="submitting()">
      Crear cuenta
    </button>
    <p class="small mb-0">¿Ya tienes cuenta? <a routerLink="/auth/login" class="fw-semibold">Inicia sesión</a></p>
  </form>
</app-auth-shell>
