<app-auth-shell title="Nueva contraseña">
  <form class="w-100 text-start" style="max-width: 360px;" [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label class="form-label" for="password">Mínimo 8 caracteres</label>
      <input
        id="password"
        type="password"
        class="form-control"
        formControlName="password"
        [class.is-invalid]="form.controls.password.invalid && form.controls.password.touched"
      />
      <div class="invalid-feedback">Mínimo 8 caracteres.</div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="passwordConfirm">Repite la nueva contraseña</label>
      <input
        id="passwordConfirm"
        type="password"
        class="form-control"
        formControlName="passwordConfirm"
        [class.is-invalid]="form.controls.passwordConfirm.touched && (form.controls.passwordConfirm.invalid || form.errors?.['passwordMismatch'])"
      />
      <div class="invalid-feedback">Las contraseñas no coinciden.</div>
    </div>
    @if (submitError()) {
      <div class="alert alert-danger py-2" role="alert">{{ submitError() }}</div>
    }
    <button type="submit" class="btn btn-dark w-100" [disabled]="submitting()">
      Guardar nueva contraseña
    </button>
  </form>
</app-auth-shell>
