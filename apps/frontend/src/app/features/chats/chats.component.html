<app-modal-panel title="Chats">
  @if (loading()) {
    <div class="card-body d-flex justify-content-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando…</span>
      </div>
    </div>
  } @else if (conversations().length === 0) {
    <div class="card-body">
      <div class="alert alert-warning d-flex align-items-center gap-2 mb-0" role="alert">
        <i class="bi bi-info-circle"></i>
        <span>Todavía no tienes ninguna conversación.</span>
      </div>
    </div>
  } @else {
    <div class="list-group list-group-flush">
      @for (conversation of conversations(); track conversation.id) {
        <button
          type="button"
          class="list-group-item list-group-item-action d-flex align-items-center gap-3"
          (click)="openConversation(conversation.id)"
        >
          <img
            [src]="conversation.otherParticipant.photoUrl"
            class="rounded-circle flex-shrink-0"
            width="40"
            height="40"
            alt=""
          />
          <div class="flex-grow-1 text-start overflow-hidden">
            <div class="d-flex justify-content-between align-items-baseline gap-2">
              <span class="fw-semibold">{{ conversation.otherParticipant.alias }}</span>
              @if (conversation.lastMessage) {
                <span class="text-body-secondary small text-nowrap">
                  {{ conversation.lastMessage.createdAt | date: 'short' }}
                </span>
              }
            </div>
            <div
              class="text-body-secondary text-truncate small"
              [class.fw-semibold]="conversation.unreadCount > 0"
            >
              {{ conversation.lastMessage?.body ?? 'Todavía no hay mensajes.' }}
            </div>
          </div>
          @if (conversation.unreadCount > 0) {
            <span class="badge rounded-pill bg-secondary flex-shrink-0">{{ conversation.unreadCount }}</span>
          }
        </button>
      }
    </div>
  }
</app-modal-panel>
